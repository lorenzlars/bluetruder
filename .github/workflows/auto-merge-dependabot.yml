name: Auto-Merge Dependabot PRs

on:
    schedule:
        - cron: "0 * * * *" # stündlich prüfen
    workflow_dispatch: {}
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        permissions:
            checks: read
            statuses: read
            pull-requests: write
            contents: read

        steps:
            - name: Auto-merge green Dependabot PRs
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const isPrEvent = Boolean(context.payload.pull_request);
                      const dependabotPrs = [];

                      if (isPrEvent) {
                        dependabotPrs.push(context.payload.pull_request.number);
                      } else {
                        const { data: openPrs } = await github.pulls.list({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: 'open',
                          per_page: 100,
                        });
                        for (const pr of openPrs) {
                          if (pr.user?.login === 'dependabot[bot]') {
                            dependabotPrs.push(pr.number);
                          }
                        }
                      }

                      if (dependabotPrs.length === 0) {
                        core.info('No open Dependabot PRs found.');
                        return;
                      }

                      for (const number of dependabotPrs) {
                        const { data: pull } = await github.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: number,
                        });

                        if (pull.state !== 'open') {
                          core.info(`PR #${number} is not open; skipping.`);
                          continue;
                        }

                        if (pull.user?.login !== 'dependabot[bot]') {
                          core.info(`PR #${number} is not from Dependabot; skipping.`);
                          continue;
                        }

                        if (pull.draft) {
                          core.info(`PR #${number} is a draft; skipping.`);
                          continue;
                        }

                        const ref = pull.head.sha;
                        const { data: combinedStatus } = await github.repos.getCombinedStatusForRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref,
                        });

                        if (combinedStatus.state !== 'success') {
                          core.info(`PR #${number} has combined status '${combinedStatus.state}'; skipping.`);
                          continue;
                        }

                        const { data: suites } = await github.checks.listSuitesForRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref,
                        });

                        if (suites.check_suites.some(suite => suite.status !== 'completed')) {
                          core.info(`PR #${number} has unfinished check suites; skipping.`);
                          continue;
                        }

                        if (suites.check_suites.some(suite => suite.conclusion !== 'success')) {
                          core.info(`PR #${number} has failing check suites; skipping.`);
                          continue;
                        }

                        try {
                          await github.pulls.merge({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            pull_number: number,
                            merge_method: 'squash',
                          });
                          core.info(`Merged Dependabot PR #${number}.`);
                        } catch (error) {
                          core.error(`Unable to merge PR #${number}: ${error.message}`);
                        }
                      }
