name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch: {}

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request in context; nothing to do.');
              return;
            }
            if (pr.draft) {
              core.info(`PR #${pr.number} is a draft; skipping.`);
              return;
            }
            try {
              const { data: current } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              if (current.auto_merge) {
                core.info(`Auto-merge already enabled for PR #${pr.number}`);
                return;
              }

              await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/auto-merge', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              core.info(`Enabled auto-merge for PR #${pr.number}`);
            } catch (error) {
              core.info(`Could not enable auto-merge for PR #${pr.number}: ${error.message}`);
            }
